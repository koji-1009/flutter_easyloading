name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Flutter EasyLoading. Please provide a minimal reproduction so the issue can be verified efficiently.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this with a currently supported Flutter EasyLoading version.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a small repository, DartPad, or provide the smallest code sample that reproduces the issue.
      placeholder: https://github.com/your-name/minimal-reproduction
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure EasyLoading with ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include complete error messages and stack traces when available.
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Flutter EasyLoading version
      placeholder: 4.0.0
    validations:
      required: true

  - type: textarea
    id: flutter-doctor
    attributes:
      label: Flutter environment
      description: Paste the output of `flutter doctor -v`.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, recordings, or other details that may help diagnose the issue.
