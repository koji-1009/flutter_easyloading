name: Feature request
description: Propose an improvement that addresses a concrete use case.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and discussions and did not find an equivalent proposal.
          required: true
        - label: This request is specific to Flutter EasyLoading rather than general Flutter support.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the user or developer problem. Avoid starting with a proposed API.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the behavior and API you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or other designs you considered.
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Backward compatible
        - Requires a deprecation cycle
        - Requires a breaking change
        - Unsure
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add API sketches, screenshots, references, or other supporting material.
